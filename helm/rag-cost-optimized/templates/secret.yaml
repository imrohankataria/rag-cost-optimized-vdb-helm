apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-cost-optimized.fullname" . }}-secrets
  labels:
    {{- include "rag-cost-optimized.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.openai.apiKey }}
  openai-api-key: {{ .Values.openai.apiKey | b64enc | quote }}
  {{- else }}
  openai-api-key: {{ "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.password }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
